services:
  bpki_ca:
    build: .
    restart: "no"
    command: bash "start.sh"
    volumes:
      - ./out:/out
      - .:/app
      - pgdata:/var/lib/postgresql/data

    ports:
      - "0.0.0.0:5000:80"
      - "54321:5432"
    env_file:
      - .service.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata: