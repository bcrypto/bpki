###############################################################################
# \brief Описание запроса / сертификата FAP = Foreign Authenticated User
# \project bpki/demo
# \remark FAP = АП-нерезидент
###############################################################################

[req]
prompt = no
distinguished_name = dn
attributes = attrs

[attrs]
challengePassword = /INFO:erip234123

[dn]
CN = ROBERT SMITH
surname = SMITH
givenName = ROBERT
serialNumber = PASGB-533324428
countryName = GB

[reqexts]
certificatePolicies = bpki-role-fap
subjectAltName = email:robert.smith@example.uk

[exts]
certificatePolicies = bpki-role-fap
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid:always, issuer
basicConstraints = critical, CA:false
keyUsage = critical, digitalSignature, keyEncipherment
extendedKeyUsage = critical, clientAuth, emailProtection
crlDistributionPoints = URI:http://bpki.by/ruc.crl
authorityInfoAccess = @aia

[aia]
caIssuers;URI = http://bpki.by/ruc.cer
OCSP;URI = http://bpki.by/ocsp
